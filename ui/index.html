<!doctype html>
<html lang="pl" data-theme="dark" data-accent="violet">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>MusicTagger</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <nav id="rail"></nav>
    <main id="main">
      <header id="topbar"></header>
      <section id="view"></section>
    </main>
    <aside id="sheet" aria-hidden="true"></aside>
    <nav id="navbar"></nav>
  </div>
  <div id="layers"></div>
  <div id="dock">
    <div id="snack" aria-live="polite"></div>
    <div id="jobs" aria-live="off"></div>
  </div>
  <div id="drop" hidden></div>
  <audio id="player" preload="none"></audio>
  <script type="module" src="app.js"></script>
</body>
</html>
