name: Build & Release

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Wersja: 1.0.<numer buildu> – rośnie automatycznie z każdym wdrożeniem.
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    name: Testy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Zależności systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
      - name: Sprawdzenie składni interfejsu
        run: for f in ui/*.js; do node --check "$f"; done

  windows:
    name: Windows (.exe / .msi)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows
      - name: Wersja
        run: python scripts/set-version.py ${{ env.APP_VERSION }}
      - run: npm ci
      - name: Budowanie
        run: npx tauri build --ci
      - name: Zebranie plików
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "dist/MusicTagger_${APP_VERSION}_x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "dist/MusicTagger_${APP_VERSION}_x64.msi"
          cp src-tauri/target/release/music-tagger.exe "dist/MusicTagger_${APP_VERSION}_portable.exe"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    name: Android (.apk)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - name: Wersja
        run: python3 scripts/set-version.py ${{ env.APP_VERSION }}
      - run: npm ci
      - name: Projekt Androida
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          python3 scripts/patch-android.py
      - name: Budowanie APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --ci --target aarch64 armv7 x86_64
      - name: Podpisanie APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "APK: $UNSIGNED"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            ALIAS="${KEY_ALIAS:-musictagger}"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 – APK podpisany jednorazowym kluczem (aktualizacja będzie wymagała odinstalowania poprzedniej wersji). Instrukcja w README."
            KEYSTORE_PASSWORD="musictagger-ci"
            ALIAS="musictagger"
            keytool -genkeypair -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MusicTagger, O=BlackSingularities, C=PL"
          fi
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$ALIAS" --out "dist/MusicTagger_${APP_VERSION}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "dist/MusicTagger_${APP_VERSION}.apk" | head -3
          rm -f release.jks
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    name: Publikacja
    needs: [windows, android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Opis wydania
        run: |
          {
            echo "## MusicTagger ${APP_VERSION}"
            echo
            echo "Gałąź: \`${GITHUB_REF_NAME}\` · commit ${GITHUB_SHA::7}"
            echo
            echo "| Plik | Do czego |"
            echo "|---|---|"
            echo "| \`MusicTagger_${APP_VERSION}_x64-setup.exe\` | Windows – instalator (zalecany) |"
            echo "| \`MusicTagger_${APP_VERSION}_x64.msi\` | Windows – instalator MSI |"
            echo "| \`MusicTagger_${APP_VERSION}_portable.exe\` | Windows – wersja bez instalacji (wymaga WebView2) |"
            echo "| \`MusicTagger_${APP_VERSION}.apk\` | Android 8.0+ |"
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: MusicTagger ${{ env.APP_VERSION }}${{ (github.ref_name != 'main' && github.ref_name != 'master' && !startsWith(github.ref, 'refs/tags/')) && format(' ({0})', github.ref_name) || '' }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' && !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
