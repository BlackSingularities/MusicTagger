name: Build & Release

# Budowanie i wydanie wyłącznie po wypchnięciu tagu wersji (np. v1.2.3).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: openmusictagger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Testy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Zależności systemowe
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets
      - name: Testy Rust
        working-directory: src-tauri
        run: cargo test --locked
      - name: Sprawdzenie składni interfejsu
        run: for f in ui/*.js; do node --check "$f"; done

  windows:
    name: Windows (.exe / .msi)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Numer wersji
        shell: bash
        run: |
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows
      - name: Wersja
        run: python scripts/set-version.py ${{ env.APP_VERSION }}
      - run: npm ci
      - name: Budowanie
        run: npx tauri build --ci
      - name: Zebranie plików
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "dist/OpenMusicTagger_${APP_VERSION}_x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "dist/OpenMusicTagger_${APP_VERSION}_x64.msi"
          cp src-tauri/target/release/open-music-tagger.exe "dist/OpenMusicTagger_${APP_VERSION}_portable.exe"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    name: Android (.apk)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Numer wersji
        shell: bash
        run: |
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - name: Wersja
        run: python3 scripts/set-version.py ${{ env.APP_VERSION }}
      - run: npm ci
      - name: Projekt Androida
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          python3 scripts/patch-android.py
      - name: Budowanie APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --ci --target aarch64 armv7 x86_64
      - name: Podpisanie APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "APK: $UNSIGNED"
          # Każde APK musi mieć ten sam podpis – inaczej Android odrzuca aktualizację.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Brak sekretów ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD – APK musi być podpisany stałym kluczem."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          ALIAS="${KEY_ALIAS:-musictagger}"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$ALIAS" --out "dist/OpenMusicTagger_${APP_VERSION}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "dist/OpenMusicTagger_${APP_VERSION}.apk" | head -3
          rm -f release.jks
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    name: Publikacja
    needs: [windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Numer wersji
        shell: bash
        run: |
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Opis wydania
        run: |
          {
            echo "## OpenMusicTagger ${APP_VERSION}"
            echo
            echo "| Plik | Do czego |"
            echo "|---|---|"
            echo "| \`OpenMusicTagger_${APP_VERSION}_x64-setup.exe\` | Windows – instalator (zalecany) |"
            echo "| \`OpenMusicTagger_${APP_VERSION}_x64.msi\` | Windows – instalator MSI |"
            echo "| \`OpenMusicTagger_${APP_VERSION}_portable.exe\` | Windows – wersja bez instalacji (wymaga WebView2) |"
            echo "| \`OpenMusicTagger_${APP_VERSION}.apk\` | Android 8.0+ |"
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenMusicTagger ${{ env.APP_VERSION }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
