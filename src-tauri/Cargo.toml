[package]
name = "open-music-tagger"
version = "1.0.0"
description = "OpenMusicTagger – inteligentne uzupełnianie tagów, okładek i tekstów (z czasami) dla Twojej muzyki"
authors = ["OpenMusicTagger"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "open_music_tagger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rusty-chromaprint = "0.3"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
walkdir = "2"
strsim = "0.11"
unicode-normalization = "0.1"
regex = "1"
once_cell = "1"
base64 = "0.22"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
